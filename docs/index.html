<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Borogroves</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      padding: 2em;
    }
    nav button {
      font-size: .8em;
      margin: 0.5em;
      padding: 0.6em 1.2em;
      border: none;
      border-radius: 0.5em;
      background-color: #007aff;
      color: white;
    }
    nav button:disabled {
      background-color: #aaa;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <!-- Connect toggle -->
  <button id="toggleConnect">Connect</button>

  <!-- Plotter toggle -->
  <button id="togglePlotter">Plotter</button>

  <!-- Controller dropdown -->
  <select id="controllerSelect" title="Controller">
    <option value="none">Controller: select option...</option>
    <option value="basic">Basic</option>
    <option value="joystick">Joystick</option>
    <option value="numpad">Keyboard</option>
  </select>
</nav>

<hr>

<div id="layout">
  <div id="controllerPane"></div>
  <div id="plotterPane"></div>
</div>

<script type="module">
import { connect } from './core/ble.js';
import { mountModule, unmount } from './core/router.js';

// window.navigate = navigate;
// window.connectBLE = connect;
let plotterOn = false;
let connected = false;



// ?
const btn = document.createElement("btn")
btn.classList.toggle("disabled", plotterOn);
btn.classList.toggle("disabled", connected);

// --- Controller dropdown ---
document.getElementById("controllerSelect").onchange = (e) => {
  const val = e.target.value;
  const prev = e.target.prev;
  if (prev != "none") {
    unmount(prev, "controller", "controllerPane");
  }
  if (val != "none") {
    mountModule(val, "controller", "controllerPane");
  }
};

document.getElementById("togglePlotter").onclick = async () => {
  // TODO: figure out cleanup logic on weird abort conditions
  plotterOn = !plotterOn;
  document.getElementById("togglePlotter").style
  if (plotterOn) {
    mountModule("plotter", "plotter", "plotterPane");
  } else {
    unmount("plotter", "plotterPane");
  }
};

// --- Connect toggle ---
document.getElementById("toggleConnect").onclick = async () => {
  connected = !connected;

  if (connected) {
    await connect("y");
    document.getElementById("toggleConnect").textContent = "Disconnect";
  } else {
    await connect("n");
    document.getElementById("toggleConnect").textContent = "Connect";
  }
};
</script>

</body>
</html>
