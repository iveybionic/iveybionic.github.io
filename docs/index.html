<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borogroves</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <!-- Connect toggle -->
  <button id="toggleConnect">Connect</button>

  <!-- Plotter toggle -->
  <button id="togglePlotter">Plotter</button>

  <!-- Controller dropdown -->
  <select id="controllerSelect" title="Controller">
    <option value="none">Controller: select option...</option>
    <option value="joystick">Joystick</option>
    <option value="numpad">Keyboard</option>
  </select>
</nav>

<hr>

<div id="layout">
  <div id="plotterPane" class="panel"></div>
  <div id="controllerPane" class="panel"></div>
</div>

<script type="module">

import { connect } from './core/ble.js';
import { mountModule, unmount } from './core/router.js';

let plotterOn = false;
let connected = false;

// --- Controller dropdown ---
document.getElementById("controllerSelect").onchange = (e) => {
  const val = e.target.value;
  const prev = e.target.prev;
  if (prev != "none") {
    unmount(prev, "controller", "controllerPane");
  }
  if (val != "none") {
    mountModule(val, "controller", "controllerPane");
  }
};

const plt = document.getElementById("togglePlotter")
plt.onclick = async () => {
  plotterOn = !plotterOn;
  if (plotterOn) {
    mountModule("plotter", "plotter", "plotterPane");
    plt.textContent = "Plotter On";
    plt.style.display = "enabled"
  } else {
    unmount("plotter", "plotterPane");
    plt.textContent = "Plotter Off";
    plt.style.display = "disabled"
  }
  plt.classList.toggle("active", plotterOn);
  plt.classList.toggle("inactive", !plotterOn);
};

// --- Connect toggle ---
const cnx = document.getElementById("toggleConnect")
cnx.onclick = async () => {
  
  if (!connected && await connect("y")) {
    connected = true;
    cnx.textContent = "Connected";
    cnx.style.enabled = "enabled";
  } else if (connected && !(await connect("n"))) {
    connected = false;
    cnx.textContent = "Disconnected";
    cnx.style.disabled = "disabled";
  }
  cnx.classList.toggle("active", connected);
  cnx.classList.toggle("inactive", !connected);
};
</script>

</body>
</html>
